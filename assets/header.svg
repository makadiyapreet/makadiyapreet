<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ff9c"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="896" height="266" rx="12" fill="#0d1117" stroke="url(#g)" stroke-width="2"/>
<rect x="3" y="3" width="894" height="34" rx="11" fill="#161b22"/>
<rect x="3" y="24" width="894" height="13" fill="#161b22"/>
<circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="66" cy="20" r="6" fill="#27c93f"/>
<text x="450" y="25" fill="#8b949e" font-size="13" text-anchor="middle">preet@pdeu: ~/security</text>

<g filter="url(#glow)" font-size="18">
<text x="28" y="80"><tspan fill="#00ff9c">preet@pdeu</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
<text x="28" y="112" fill="#58a6ff" font-weight="bold">Preet Makadiya  |  VAPT  |  Red Team  |  Full-Stack</text>
<text x="28" y="156"><tspan fill="#00ff9c">preet@pdeu</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">cat mission.txt</tspan></text>
<text x="28" y="188" fill="#d2a8ff">Think like an attacker. Build like a defender.</text>
<text x="28" y="232"><tspan fill="#00ff9c">preet@pdeu</tspan><tspan fill="#8b949e">:~$ </tspan></text>
</g>

<!-- typing reveal covers -->
<rect x="28" y="62" width="230" height="24" fill="#0d1117"><animate attributeName="x" from="28" to="258" dur="1.2s" begin="0.4s" fill="freeze"/><animate attributeName="width" from="230" to="0" dur="1.2s" begin="0.4s" fill="freeze"/></rect>
<rect x="28" y="94" width="560" height="24" fill="#0d1117"><animate attributeName="x" from="28" to="588" dur="2s" begin="1.8s" fill="freeze"/><animate attributeName="width" from="560" to="0" dur="2s" begin="1.8s" fill="freeze"/></rect>
<rect x="28" y="138" width="330" height="24" fill="#0d1117"><animate attributeName="x" from="28" to="358" dur="1.4s" begin="4.2s" fill="freeze"/><animate attributeName="width" from="330" to="0" dur="1.4s" begin="4.2s" fill="freeze"/></rect>
<rect x="28" y="170" width="510" height="24" fill="#0d1117"><animate attributeName="x" from="28" to="538" dur="2.2s" begin="5.8s" fill="freeze"/><animate attributeName="width" from="510" to="0" dur="2.2s" begin="5.8s" fill="freeze"/></rect>
<rect x="28" y="214" width="230" height="24" fill="#0d1117"><animate attributeName="x" from="28" to="258" dur="0.6s" begin="8.2s" fill="freeze"/><animate attributeName="width" from="230" to="0" dur="0.6s" begin="8.2s" fill="freeze"/></rect>
<rect x="222" y="217" width="11" height="20" fill="#00ff9c" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="8.8s" repeatCount="indefinite"/></rect>

<!-- right-side vuln ticker -->
<g font-size="13" fill="#00ff9c" opacity="0.5">
<text x="690" y="80">[+] SQLi ........ OK<animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/></text>
<text x="690" y="108">[+] XSS ......... OK<animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="0.8s" repeatCount="indefinite"/></text>
<text x="690" y="136">[+] SSRF ........ OK<animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="1.6s" repeatCount="indefinite"/></text>
<text x="690" y="164">[+] IDOR ........ OK<animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="2.4s" repeatCount="indefinite"/></text>
<text x="690" y="192">[+] RCE ......... OK<animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="3.2s" repeatCount="indefinite"/></text>
</g>

<!-- scanline -->
<rect x="3" y="37" width="894" height="3" fill="#00ff9c" opacity="0.08"><animate attributeName="y" from="37" to="266" dur="5s" repeatCount="indefinite"/></rect>
</svg>
